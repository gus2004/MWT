services:
  postgres:
    image: postgres:16-alpine
    container_name: mwt-postgres
    environment:
      POSTGRES_USER: mwtuser
      POSTGRES_PASSWORD: mwtpassword
      POSTGRES_DB: mwt_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mwtuser -d mwt_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: mwt-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data: